name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VoiceVault APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Android APKs (Debug & Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Prepare APK Files
        run: |
          mkdir -p build-apks
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-apks/VoiceVault-Debug.apk \;
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} build-apks/VoiceVault-Release.apk \;
          ls -la build-apks/

      - name: Upload VoiceVault APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceVault-Android-APKs
          path: build-apks/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.1
          name: "VoiceVault v1.3.1 (Standalone Offline Bundled)"
          body: |
            ## VoiceVault v1.3.1 for Android 🎙️📞☁️

            ### 🚀 What's Fixed in v1.3.1:
            - **Fixed "Unable to load script" (index.android.bundle)**: Configured `debuggableVariants = []` so that the complete JavaScript bundle is compiled and packaged directly into the APK assets. The app now runs completely offline on your phone without needing Metro or a computer connection.
            - **Modern Audio Engine (expo-audio)**: Zero native JSI linking errors, rock-solid Android 14+ compatibility.
            - **Native WhatsApp Call Auto-Recorder**: Accessibility Service + Foreground Service.

            ### 📱 Direct Download Links for Your Phone:
            - **[Download VoiceVault-Debug.apk (Recommended)](https://github.com/sahand-git/voice-vault/releases/download/v1.3.1/VoiceVault-Debug.apk)**
            - **[Download VoiceVault-Release.apk](https://github.com/sahand-git/voice-vault/releases/download/v1.3.1/VoiceVault-Release.apk)**

            ### ⚙️ How to Activate WhatsApp Auto-Recording:
            1. Install and open VoiceVault.
            2. Go to the **Backup / Settings** tab.
            3. Under **WhatsApp & Call Auto-Recorder**, tap **Turn ON** for:
               - **Call Screen Detection** (Enable VoiceVault in Android Accessibility Settings)
               - **Incoming Call Listener** (Enable Notification Access)
               - **Background Protection** (Allow Unrestricted Battery)
          files: |
            build-apks/VoiceVault-Debug.apk
            build-apks/VoiceVault-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
