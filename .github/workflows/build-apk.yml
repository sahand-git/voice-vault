name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VoiceVault APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Android APKs (Debug & Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Prepare APK Files
        run: |
          mkdir -p build-apks
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-apks/VoiceVault-Debug.apk \;
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} build-apks/VoiceVault-Release.apk \;
          ls -la build-apks/

      - name: Upload VoiceVault APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceVault-Android-APKs
          path: build-apks/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "VoiceVault v1.2.0 (Stabilized & Auto Call Recorder)"
          body: |
            ## VoiceVault v1.2.0 for Android 🎙️📞☁️

            ### ✨ What's Fixed in v1.2.0:
            - **Disabled React Native New Architecture in Gradle**: Switched `newArchEnabled=false` in `gradle.properties` to ensure 100% native stability and compatibility with Android audio recording and native modules.
            - **Native Crash Diagnostic Handler**: Integrated `CrashHandler` and `CrashReportActivity` so if an error ever occurs, it is captured and displayed clearly instead of closing the app.
            - **Safe Foreground Service**: Fixed notification icon and microphone permission checks before initializing Android foreground recording.

            ### 📱 Direct Download Links for Your Phone:
            - **[Download VoiceVault.apk (Recommended - Debug Signed)](https://github.com/sahand-git/voice-vault/releases/download/v1.2.0/VoiceVault-Debug.apk)**
            - **[Download VoiceVault-Release.apk](https://github.com/sahand-git/voice-vault/releases/download/v1.2.0/VoiceVault-Release.apk)**

            ### ⚙️ How to Activate WhatsApp Auto-Recording:
            1. Install and open VoiceVault.
            2. Go to the **Backup / Settings** tab.
            3. Under **WhatsApp & Call Auto-Recorder**, tap **Turn ON** for:
               - **Call Screen Detection** (Enable VoiceVault in Android Accessibility Settings)
               - **Incoming Call Listener** (Enable Notification Access)
               - **Background Protection** (Allow Unrestricted Battery)
          files: |
            build-apks/VoiceVault-Debug.apk
            build-apks/VoiceVault-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
